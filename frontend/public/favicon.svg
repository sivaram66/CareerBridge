<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#1B1E16"/>

  <!-- Star (goal) -->
  <path d="M24 4 L24.8 6.5 L27.5 6.5 L25.4 8.1 L26.2 10.6 L24 9 L21.8 10.6 L22.6 8.1 L20.5 6.5 L23.2 6.5 Z" fill="#D1F55C"/>

  <!-- Steps -->
  <rect x="3" y="22" width="5" height="7" rx="1" fill="#D1F55C" opacity="0.45"/>
  <rect x="9" y="18" width="5" height="11" rx="1" fill="#D1F55C" opacity="0.62"/>
  <rect x="15" y="14" width="5" height="15" rx="1" fill="#D1F55C" opacity="0.8"/>

  <!-- Person head -->
  <circle cx="13" cy="10" r="2" fill="#D1F55C"/>

  <!-- Body -->
  <line x1="13" y1="12" x2="13" y2="16" stroke="#D1F55C" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="13" y1="16" x2="10.5" y2="19" stroke="#D1F55C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="16" x2="15" y2="19" stroke="#D1F55C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms -->
  <line x1="13" y1="13.5" x2="10.5" y2="15" stroke="#D1F55C" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="13" y1="13.5" x2="15.5" y2="12.5" stroke="#D1F55C" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Briefcase -->
  <rect x="7.5" y="14.5" width="3.5" height="2.5" rx="0.6" fill="#D1F55C"/>
  <path d="M8.5 14.5 L8.5 14 Q9 13.5 9.5 14 L9.5 14.5" stroke="#D1F55C" stroke-width="0.7" fill="none"/>
</svg>
